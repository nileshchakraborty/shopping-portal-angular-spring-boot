name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    name: Build Angular frontend
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: frontend/shopping-portal-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '12'
          cache: npm
          cache-dependency-path: frontend/shopping-portal-ui/package-lock.json
      - run: npm ci
      - run: npm run build -- --configuration=production
